; PHP settings for the Vercel runtime (removed from the bundle at build time).
; Vercel rejects request bodies over 4.5 MB, so photos are resized in the browser first.
upload_max_filesize = 5M
post_max_size = 5M
max_file_uploads = 25
memory_limit = 256M
expose_php = Off
display_errors = Off
log_errors = On
session.gc_probability = 0
